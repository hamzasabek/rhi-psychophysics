; ===========================================================================
;  PlatformIO project configuration
;
;  Two "environments" are defined:
;
;    teensy41 - builds for the real board and uploads over USB
;    native   - builds the same source for THIS computer, so the pure-logic
;               parts (clock arithmetic, event queue, scheduling) can be
;               unit-tested with no hardware attached
; ===========================================================================

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; -O2            optimise for speed
; -std=gnu++17   the C++ dialect we use
; -Wall -Wextra  turn on warnings; we treat them as bugs
build_flags =
    -O2
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type

monitor_speed = 115200


[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNIT_TEST
