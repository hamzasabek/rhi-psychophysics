; ===========================================================================
;  servo_char - a throwaway test program for roadmap Step 3.1
;
;  This is a SEPARATE PlatformIO project, on purpose. It has its own folder
;  and its own build, so uploading it cannot change the real firmware in
;  firmware/src. To go back to the real firmware, just upload that again.
;
;  Build and upload (Teensy plugged in, serial monitor closed):
;      cd firmware/experiments/servo_char
;      pio run -t upload
;  Then talk to it:
;      pio device monitor
; ===========================================================================

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; Same warning settings as the real firmware: warnings are treated as bugs.
build_flags =
    -O2
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type

monitor_speed = 115200
; Show what you type and end each line with '\n' when you press Enter.
monitor_echo  = yes
monitor_eol   = LF
