; ===========================================================================
;  arm_taps - a throwaway bench experiment: try the tap stimulation by hand
;
;  Runs the three-stage tap (select a site, tap, lift) on the two arms with the
;  site angles measured in Step 3.2: single taps, random sites, whole 6-tap
;  trials, and an asynchrony between the two arms.
;
;  This is a SEPARATE PlatformIO project, on purpose, exactly like arm_jog and
;  servo_char: its own folder and its own build, so uploading it cannot change
;  the real firmware in firmware/src. To go back to arm_jog or to the real
;  firmware, upload that one instead.
;
;  Build and upload (servo power OFF, Teensy plugged in, serial monitor closed):
;      cd firmware/experiments/arm_taps
;      pio run -t upload
;  Then talk to it:
;      pio device monitor
; ===========================================================================

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; Same warning settings as the real firmware: warnings are treated as bugs.
; The -I line lets this project use the real firmware's Clock.h (the project's
; rollover-safe time test) without copying it: ../../src is firmware/src.
build_flags =
    -O2
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type
    -I../../src

monitor_speed = 115200
; Show what you type and end each line with '\n' when you press Enter.
monitor_echo  = yes
monitor_eol   = LF
