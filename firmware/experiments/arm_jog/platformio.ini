; ===========================================================================
;  arm_jog - a throwaway test program for roadmap Step 3.2
;
;  Moves the four servos of the two arms by typed commands, so the joint
;  settings for the five finger sites can be found by hand.
;
;  This is a SEPARATE PlatformIO project, on purpose, exactly like servo_char:
;  its own folder and its own build, so uploading it cannot change the real
;  firmware in firmware/src. To go back to the real firmware, upload that.
;
;  Build and upload (Teensy plugged in, serial monitor closed):
;      cd firmware/experiments/arm_jog
;      pio run -t upload
;  Then talk to it:
;      pio device monitor
; ===========================================================================

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; Same warning settings as the real firmware: warnings are treated as bugs.
build_flags =
    -O2
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type

monitor_speed = 115200
; Show what you type and end each line with '\n' when you press Enter.
monitor_echo  = yes
monitor_eol   = LF
