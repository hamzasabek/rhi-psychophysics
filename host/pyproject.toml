[project]
name = "rhi"
version = "0.2.0"
description = "Host-side control and analysis for the RHI psychophysics rig"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",     # talks to the Teensy over USB
    "numpy>=1.24",       # arrays and random number generation
    "pandas>=2.0",       # data logging and analysis
    "sounddevice>=0.4",  # masking white noise and cue tones
    "pygame>=2.5",       # full-screen projected noise field
    "matplotlib>=3.7",   # figures
    "scipy>=1.10",       # peak finding, curve fitting
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rhi*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

